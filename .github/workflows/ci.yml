name: RH foundation checks
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:

# Feature branches run checks on PRs; main continues to run checks on pushes.
# Cancel obsolete PR attempts when new commits arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r research-api/requirements.lock -r tests/requirements.txt
      - run: python -m pytest tests -q
      - run: python -m compileall -q research-api
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check research-web/assets/research-workbench-bridge.js
      - run: node --test tests/*.cjs
      - name: WordPress bridge PHP tests (PHP preinstalled on the runner image)
        run: |
          php --version | head -1
          for t in tests/php/*.php; do php "$t"; done
      - name: Public source scan (allowlist, private-name and credential rules, SOURCE_MANIFEST)
        run: python scripts/check_public_source.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same pinned image digest as the production Compose file, so migrations are tested on identical PostgreSQL.
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: research_staging
          POSTGRES_USER: research_staging
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U research_staging -d research_staging"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RESEARCH_DATABASE_URL: postgresql+psycopg://research_staging:synthetic-ci-only@127.0.0.1:5432/research_staging
      PYTHONPATH: research-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r research-api/requirements.lock
      - run: psql -h 127.0.0.1 -U research_staging -d research_staging -c 'CREATE ROLE research_reader LOGIN'
        env: {PGPASSWORD: synthetic-ci-only}
      - run: alembic -c research-api/alembic.ini upgrade head
      - run: python scripts/accept_postgres.py
      - run: alembic -c research-api/alembic.ini downgrade base
      - run: alembic -c research-api/alembic.ini upgrade head
