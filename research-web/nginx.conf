server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    # SC-FIG-02B: same-origin scripts only (no eval); the vendored renderers inject inline styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    location /api/research/v1/ {
        proxy_pass http://research-api:8000;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
