server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    location /api/research/v1/ {
        # API responses keep their own headers (figure files carry a sandbox policy).
        proxy_pass http://research-api:8000;
    }
    location / {
        # SC-FIG-02B: same-origin scripts only (no eval); the vendored renderers inject inline styles.
        # SC-FIG-04: the MapLibre worker runs only from a blob: URL made after its SHA-384 is checked.
        # add_header here replaces the server-level headers for this location, so nosniff is repeated.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; worker-src blob:; child-src blob:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
