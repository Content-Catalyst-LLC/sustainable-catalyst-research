server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    # SC-SCI-02: the signed-in researcher's routes go to the private writer service. It resolves at request time,
    # so a deployment without one answers 502 instead of failing to start; the public reader never serves them.
    location ~ ^/api/research/v1/(console|editorial)/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $research_writer http://research-convergence:8000;
        proxy_pass $research_writer;
    }
    location /api/research/v1/ {
        # API responses keep their own headers (figure files carry a sandbox policy).
        proxy_pass http://research-api:8000;
    }
    location /console/ {
        # SC-SCI-02 Research Console: same-origin scripts; Workspace (sign-in, notebooks, grants) is the only other
        # origin it may call. The Docker build fills in the origin (RESEARCH_CONSOLE_WORKSPACE_ORIGIN).
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' __WORKSPACE_ORIGIN__; worker-src blob:; child-src blob:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        try_files $uri /console/index.html;
    }
    location / {
        # SC-FIG-02B: same-origin scripts only (no eval); the vendored renderers inject inline styles.
        # SC-FIG-04: the MapLibre worker runs only from a blob: URL made after its SHA-384 is checked.
        # add_header here replaces the server-level headers for this location, so nosniff is repeated.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; worker-src blob:; child-src blob:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
